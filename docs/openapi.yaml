components:
  schemas:
    Attribute:
      enum:
      - light
      - dark
      - earth
      - water
      - fire
      - wind
      - divine
      title: Attribute
      type: string
    Body_upload_image_api_uploads_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          description: Imagem JPEG, PNG ou WebP
          title: File
          type: string
      required:
      - file
      title: Body_upload_image_api_uploads_post
      type: object
    CardKind:
      enum:
      - monster
      - spell
      - trap
      title: CardKind
      type: string
    CardList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CardRead'
          title: Items
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
      required:
      - items
      - limit
      - offset
      title: CardList
      type: object
    CardPatch:
      additionalProperties: false
      description: 'Atualização parcial: envia apenas o que mudou.'
      properties:
        archetype:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          title: Archetype
        atk:
          anyOf:
          - maximum: 5000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Atk
        attribute:
          anyOf:
          - $ref: '#/components/schemas/Attribute'
          - type: 'null'
        defense:
          anyOf:
          - maximum: 5000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Defense
        description:
          anyOf:
          - maxLength: 800
            type: string
          - type: 'null'
          title: Description
        holo:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Holo
        image_path:
          anyOf:
          - maxLength: 300
            type: string
          - type: 'null'
          title: Image Path
        image_url:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Image Url
        is_public:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Public
        kind:
          anyOf:
          - $ref: '#/components/schemas/CardKind'
          - type: 'null'
        level:
          anyOf:
          - maximum: 13.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Level
        monster_kind:
          anyOf:
          - $ref: '#/components/schemas/MonsterKind'
          - type: 'null'
        name:
          anyOf:
          - maxLength: 60
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        race:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Race
        spell_kind:
          anyOf:
          - $ref: '#/components/schemas/SpellKind'
          - type: 'null'
        trap_kind:
          anyOf:
          - $ref: '#/components/schemas/TrapKind'
          - type: 'null'
      title: CardPatch
      type: object
    CardRead:
      description: Representação pública de uma carta.
      properties:
        archetype:
          anyOf:
          - type: string
          - type: 'null'
          title: Archetype
        atk:
          anyOf:
          - type: integer
          - type: 'null'
          title: Atk
        attribute:
          anyOf:
          - $ref: '#/components/schemas/Attribute'
          - type: 'null'
        created_at:
          format: date-time
          title: Created At
          type: string
        defense:
          anyOf:
          - type: integer
          - type: 'null'
          title: Defense
        description:
          title: Description
          type: string
        holo:
          title: Holo
          type: boolean
        id:
          title: Id
          type: string
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        is_public:
          title: Is Public
          type: boolean
        kind:
          $ref: '#/components/schemas/CardKind'
        level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Level
        monster_kind:
          anyOf:
          - $ref: '#/components/schemas/MonsterKind'
          - type: 'null'
        name:
          title: Name
          type: string
        race:
          anyOf:
          - type: string
          - type: 'null'
          title: Race
        slug:
          title: Slug
          type: string
        spell_kind:
          anyOf:
          - $ref: '#/components/schemas/SpellKind'
          - type: 'null'
        trap_kind:
          anyOf:
          - $ref: '#/components/schemas/TrapKind'
          - type: 'null'
        updated_at:
          format: date-time
          title: Updated At
          type: string
        views:
          title: Views
          type: integer
      required:
      - id
      - slug
      - name
      - kind
      - description
      - holo
      - is_public
      - views
      - created_at
      - updated_at
      title: CardRead
      type: object
    CardWrite:
      additionalProperties: false
      description: Payload de criação/edição de uma carta.
      properties:
        archetype:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          title: Archetype
        atk:
          anyOf:
          - maximum: 5000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Atk
        attribute:
          anyOf:
          - $ref: '#/components/schemas/Attribute'
          - type: 'null'
        defense:
          anyOf:
          - maximum: 5000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Defense
        description:
          default: ''
          maxLength: 800
          title: Description
          type: string
        holo:
          default: true
          title: Holo
          type: boolean
        image_path:
          anyOf:
          - maxLength: 300
            type: string
          - type: 'null'
          title: Image Path
        image_url:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Image Url
        is_public:
          default: true
          title: Is Public
          type: boolean
        kind:
          $ref: '#/components/schemas/CardKind'
        level:
          anyOf:
          - maximum: 13.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Level
        monster_kind:
          anyOf:
          - $ref: '#/components/schemas/MonsterKind'
          - type: 'null'
        name:
          examples:
          - Julia, Dama de Köln
          maxLength: 60
          minLength: 1
          title: Name
          type: string
        race:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          examples:
          - Dragão
          title: Race
        spell_kind:
          anyOf:
          - $ref: '#/components/schemas/SpellKind'
          - type: 'null'
        trap_kind:
          anyOf:
          - $ref: '#/components/schemas/TrapKind'
          - type: 'null'
      required:
      - name
      - kind
      title: CardWrite
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MonsterKind:
      enum:
      - normal
      - effect
      - ritual
      - fusion
      - synchro
      - xyz
      - link
      - pendulum
      - token
      title: MonsterKind
      type: string
    SpellKind:
      enum:
      - normal
      - continuous
      - equip
      - quick_play
      - field
      - ritual
      title: SpellKind
      type: string
    TrapKind:
      enum:
      - normal
      - continuous
      - counter
      title: TrapKind
      type: string
    UploadResult:
      properties:
        content_type:
          const: image/webp
          default: image/webp
          title: Content Type
          type: string
        height:
          title: Height
          type: integer
        path:
          title: Path
          type: string
        url:
          title: Url
          type: string
        width:
          title: Width
          type: integer
      required:
      - url
      - path
      - width
      - height
      title: UploadResult
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  contact:
    name: Mateus Jairan
    url: https://github.com/mateusjairan/YGO_card_maker
  description: '

    API do **YGO Card Maker**: criação de cartas customizadas de Yu-Gi-Oh! com

    arte própria, moldura por atributo, exportação em PNG e link compartilhável.

    '
  license:
    name: MIT
  title: YGO Card Maker API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/cards:
    get:
      description: Galeria pública (cartas marcadas como públicas).
      operationId: list_public_cards_api_cards_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 24
          maximum: 60
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 60
            type: string
          - type: 'null'
          title: Q
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Public Cards
      tags:
      - cards
    post:
      description: Cria uma carta. Requer o cabeçalho `X-Owner-Key`.
      operationId: create_card_api_cards_post
      parameters:
      - in: header
        name: X-Owner-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Owner-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardWrite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRead'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Card
      tags:
      - cards
  /api/cards/mine:
    get:
      description: Cartas do duelista dono da chave enviada.
      operationId: list_my_cards_api_cards_mine_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: header
        name: X-Owner-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Owner-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List My Cards
      tags:
      - cards
  /api/cards/slug/{slug}:
    get:
      description: Busca pela URL amigável (usada pela página de compartilhamento).
      operationId: get_card_by_slug_api_cards_slug__slug__get
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          title: Slug
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRead'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Card By Slug
      tags:
      - cards
  /api/cards/{card_id}:
    delete:
      description: Remove a carta e a imagem associada (apenas o dono).
      operationId: delete_card_api_cards__card_id__delete
      parameters:
      - in: path
        name: card_id
        required: true
        schema:
          title: Card Id
          type: string
      - in: header
        name: X-Owner-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Owner-Key
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Card
      tags:
      - cards
    get:
      operationId: get_card_api_cards__card_id__get
      parameters:
      - in: path
        name: card_id
        required: true
        schema:
          title: Card Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRead'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Card
      tags:
      - cards
    patch:
      description: Atualiza a carta (apenas o dono).
      operationId: update_card_api_cards__card_id__patch
      parameters:
      - in: path
        name: card_id
        required: true
        schema:
          title: Card Id
          type: string
      - in: header
        name: X-Owner-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Owner-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRead'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Card
      tags:
      - cards
  /api/uploads:
    post:
      description: Recebe a imagem, reencoda para WebP e devolve a URL pública.
      operationId: upload_image_api_uploads_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_image_api_uploads_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Upload Image
      tags:
      - uploads
